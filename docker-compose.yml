# AgentShield AI - environnement de developpement (AS-S1-005).
#   cp .env.example .env   puis   docker compose up --build
#
# Reseaux :
#   internal : postgres + ai-service + backend (aucun acces exterieur, `internal: true`)
#   public   : backend + frontend (seuls ports publies sur l'hote : 8080 et 5173)
# ai-service et postgres ne sont JAMAIS publies sur l'hote.

name: agentshield

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?definir POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?definir AI_SERVICE_KEY dans .env}
      GUARD_A_MODEL: ${GUARD_A_MODEL:-}
      GUARD_A_DEVICE: ${GUARD_A_DEVICE:-cpu}
    networks: [internal]
    healthcheck:
      # Pas de curl dans l'image slim : on utilise Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY}
      # Utilises a partir de AS-S1-016 (Flyway / JPA).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    networks: [internal, public]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/system/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Serveur de developpement Vite (profil `dev`) : docker compose --profile dev up
  frontend:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks: [public]

networks:
  internal:
    internal: true
  public:

volumes:
  pgdata:
  frontend_node_modules:

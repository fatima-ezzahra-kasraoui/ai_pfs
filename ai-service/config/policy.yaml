# Valeurs de départ (Annexe A du dossier). Propriétaire : É2 (chargeur, moteur).
# Les seuils marqués TEMPORARY sont provisoires jusqu'au réglage sur la validation
# (AS-S4-001, `python -m evaluation.tune_thresholds`) puis gel (tag thresholds-frozen).
# Proposition de planification : `logging.db_path` (SQLite) est retiré — le service IA
# n'écrit pas en base, le backend Spring persiste les verdicts.
thresholds:                  # TEMPORARY
  injection_block: 0.90      # score > 0.90 -> BLOCK
  injection_review: 0.50     # 0.50 à 0.90 -> SANITIZE ou CONFIRM
  coherence_min: 0.40        # similarité action/demande minimale
tools:
  read_email: { risk: low, allowed: true }
  browse_web: { risk: low, allowed: true }
  read_file: { risk: low, allowed: true }
  send_email: { risk: medium, allowed: true, confirm_if_unknown_recipient: true }
  delete_file: { risk: high, allowed: true, require_confirmation: true }
output:
  mask_patterns: [api_key, iban, credit_card]
  canary_tokens: [sk-FAKE-1234]
  on_secret_detected: SANITIZE
  on_canary_in_outgoing_tool: BLOCK
logging:
  mask_excerpts: true
